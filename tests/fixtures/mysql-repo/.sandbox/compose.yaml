# Fixture repo for the Compose integration tests: one backing service with a healthcheck,
# a named volume, and a config file mounted by a path relative to this file.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sandbox
      MYSQL_DATABASE: app
    volumes:
      - data:/var/lib/mysql
      - ./conf/sandbox.cnf:/etc/mysql/conf.d/sandbox.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psandbox", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
volumes:
  data: {}
