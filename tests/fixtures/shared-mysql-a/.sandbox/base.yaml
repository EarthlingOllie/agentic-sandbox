services:
  mysql-base:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sandbox
      MYSQL_DATABASE: app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psandbox", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
