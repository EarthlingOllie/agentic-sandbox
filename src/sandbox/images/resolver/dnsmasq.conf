# Answer from Docker's DNS only: no upstream servers from resolv.conf, nothing from
# /etc/hosts. The one forwarding rule, `server=/<domain>/127.0.0.11`, is passed on the
# command line because the domain is the developer's choice.
no-resolv
no-hosts
# Docker answers with a 600-second TTL; a cached answer would outlive a recreated container.
cache-size=0
max-ttl=1
# Listen on every network the resolver is attached to, including ones attached while it
# runs, but never on loopback: Docker's DNS forwards names it does not know to the
# container's own DNS server (127.0.0.1, see compose.yaml), where nothing may answer.
bind-dynamic
except-interface=lo
# Not root (see compose.yaml), so not port 53: an unprivileged port needs no capability to
# bind, now or when a set's network is attached later. Published on the machine as the
# resolver's fixed port.
port=5353
# The root filesystem is read-only and nothing reads a pid file.
pid-file
