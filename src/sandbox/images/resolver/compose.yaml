# The resolver's own Compose project: one container, shared by every set and belonging to
# none. sandbox starts it with the variables below set (`sandbox.compose.resolver`); set
# networks are attached and detached around it with `docker network connect`.
services:
  resolver:
    image: ${SANDBOX_RESOLVER_IMAGE:?set by sandbox}
    build:
      context: .
    # Built from this directory when missing and never pulled, so an image of the same
    # name on a registry can't stand in for the bundled one.
    pull_policy: never
    container_name: ${SANDBOX_RESOLVER_CONTAINER:?set by sandbox}
    command: ["--server=/${SANDBOX_RESOLVER_DOMAIN:?set by sandbox}/127.0.0.11"]
    # An upstream DNS server that cannot answer, so Docker's DNS fails a name it does not
    # know at once instead of forwarding it to the machine's DNS servers.
    dns: ["127.0.0.1"]
    # The machine's loopback only, on a port that is not 53. This goes through the project's
    # own network, which stays attached for the resolver's lifetime. Inside the container
    # dnsmasq listens on 5353 (dnsmasq.conf).
    ports:
      - "127.0.0.1:${SANDBOX_RESOLVER_PORT:?set by sandbox}:5353/udp"
      - "127.0.0.1:${SANDBOX_RESOLVER_PORT:?set by sandbox}:5353/tcp"
    # Every set's containers can send this container packets, so it holds nothing worth
    # taking: not root, no capabilities at all (its port is unprivileged, so binding it
    # needs none), no way to gain any, a read-only root filesystem, and no mounts: its
    # configuration is in the image, and the Docker socket is nowhere near it.
    user: "65534:65534"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # Comes back with Docker, which restores the networks it was attached to.
    restart: always
    labels:
      sandbox.resolver: "true"
