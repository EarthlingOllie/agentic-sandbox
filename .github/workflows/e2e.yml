name: E2E

# The walkthrough harness (tests/e2e): the installed `sandbox` CLI on a runner it really
# changes. It runs `sudo sandbox setup` (which points systemd-resolved at the resolver for
# the domain and installs the mkcert CA), every verb, and a connection to every address
# every set reports, resolved through the operating system. It needs passwordless sudo and
# systemd-resolved, which GitHub-hosted Ubuntu runners provide; if org policy forbids sudo
# there, point `runs-on` at a self-hosted Linux runner that has both.
#
# Deliberately not on every push (ci.yml runs the unit and integration jobs there): it runs
# nightly, on demand, and for release tags. On macOS a person runs the same harness with
# OrbStack before each release (docs/release-checklist-macos.md).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: walkthrough harness (Linux, sudo, systemd-resolved)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Passwordless sudo is available
        run: sudo -n true
      - name: systemd-resolved answers this machine's lookups
        run: systemctl is-active systemd-resolved && resolvectl status
      - run: docker compose version
      # mkcert issues the sets' certificates; `sandbox setup` installs its CA system-wide.
      - run: sudo apt-get update && sudo apt-get install -y mkcert libnss3-tools
      # Pulled up front so a slow registry shows up here, not as a healthcheck timeout.
      # ubuntu:24.04 is the base of the agent and resolver images, which `up` builds.
      - run: docker pull ubuntu:24.04
      - run: docker pull mysql:8.4
      - run: docker pull redis:7-alpine
      - run: docker pull python:3.12-alpine
      - name: Walkthrough harness
        # bash with pipefail (what `shell: bash` means here), so `tee` cannot hide a failure.
        shell: bash
        run: SANDBOX_E2E=1 uv run pytest -m e2e tests/e2e -v 2>&1 | tee walkthrough.log
      # The harness prints its report at the end of the log above, pass or fail: every
      # command, what was checked, and the output of anything that failed. Here it is put
      # on the run's summary page as well.
      - name: Walkthrough report
        if: always()
        run: |
          [ -f walkthrough.log ] || exit 0
          {
            echo '## sandbox walkthrough report'
            echo
            echo '```text'
            sed -n '/ sandbox walkthrough report /,$p' walkthrough.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The machine after the run
        if: always()
        run: |
          resolvectl status || true
          ls -l /etc/systemd/resolved.conf.d/ || true
          docker ps --all || true
          docker network ls || true
